version: '3.8'

services:
  servidor1:
    build: .
    container_name: servidor1
    environment:
      - SERVIDOR=Servidor 1

  servidor2:
    build: .
    container_name: servidor2
    environment:
      - SERVIDOR=Servidor 2

  servidor3:
    build: .
    container_name: servidor3
    environment:
      - SERVIDOR=Servidor 3

  balanceador:
    image: nginx:alpine
    container_name: balanceador
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - servidor1
      - servidor2
      - servidor3